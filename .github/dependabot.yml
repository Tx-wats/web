version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: /
    groups:
      minor-patch:
        dependency-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps):'
      prefix-scope: npm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps):'
      prefix-scope: github-actions
